[package]
name = "numcp"
version = "0.1.0"
edition = "2024"
authors = ["Joseph O'Brien <89jobrien@users.noreply.github.com>"]
license = "MIT OR Apache-2.0"
description = "MCP server that exposes Nushell tool handlers as MCP tools"
repository = "https://github.com/89jobrien/numcp"
keywords = ["mcp", "nushell", "nu", "llm", "agent"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "numcp"
path = "src/lib.rs"

[[bin]]
name = "numcp"
path = "src/main.rs"

[features]
default = ["nu-engine"]
nu-engine = [
    "dep:nu-mcp",
    "dep:nu-engine",
    "dep:nu-parser",
    "dep:nu-protocol",
    "dep:nu-cmd-lang",
    "dep:nuon",
    "dep:nu-command",
]

[dependencies]
# MCP protocol — official Rust SDK
rmcp = { version = "1", features = ["server", "macros", "client", "transport-child-process"] }

# Nu engine for executing Nu tool handlers (heavy — optional, gated by nu-engine feature)
nu-mcp = { version = "0.113.1", optional = true }
nu-engine = { version = "0.113.1", optional = true }
nu-parser = { version = "0.113.1", optional = true }
nu-protocol = { version = "0.113.1", optional = true }
nu-cmd-lang = { version = "0.113.1", optional = true }
nuon = { version = "0.113.1", optional = true }
nu-command = { version = "0.113.1", optional = true }

# CLI
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_complete_nushell = "4"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Config file
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }

# Error handling
anyhow = "1"
thiserror = "2"

[[test]]
name = "round_trip"
path = "tests/integration/round_trip.rs"

[dev-dependencies]
proptest = "1"
